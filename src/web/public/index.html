<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grilling</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#detail">Skip to decision</a>
    <header class="appbar">
      <a class="wordmark" href="/">Grilling<span aria-hidden="true">.</span></a
      ><button id="brief-open" class="project" aria-label="Read brief">Design session</button
      ><button id="mode" class="mode" aria-label="About this example"></button>
      <div class="app-actions">
        <button id="activity-open">Activity <span id="activity-count"></span></button
        ><button id="explore" class="run">Explore</button>
      </div>
    </header>
    <div id="error" role="alert" hidden></div>
    <div id="feedback" role="status"></div>
    <div class="layout">
      <aside class="queue">
        <div class="queue-title">
          <h1>Decisions</h1>
          <span id="total"></span>
        </div>
        <div id="queue-list"></div>
        <button id="steer-open" class="direction">+ Add a constraint</button>
      </aside>
      <section class="workspace">
        <nav aria-label="Views">
          <button data-view="decision" aria-current="page">Compare</button
          ><button data-view="graph">Graph</button><button data-view="spec">Specification</button
          ><button id="export" class="export">Export ↓</button>
        </nav>
        <div id="reviews"></div>
        <main id="detail" tabindex="-1"></main>
      </section>
    </div>
    <dialog id="brief-dialog">
      <header>
        <h2>Brief</h2>
        <button data-close aria-label="Close brief">×</button>
      </header>
      <p id="brief-text"></p>
      <div id="context"></div>
      <button id="constraint-brief" class="choose">Add a constraint</button>
      <p id="provider-note" class="muted"></p>
    </dialog>
    <dialog id="activity-dialog">
      <header>
        <h2>Activity</h2>
        <button data-close aria-label="Close activity">×</button>
      </header>
      <div id="activity"></div>
    </dialog>
    <dialog id="steer-dialog">
      <form id="steer-form">
        <header>
          <h2>Add a constraint</h2>
          <button type="button" data-close aria-label="Close constraint">×</button>
        </header>
        <label for="steer-text">What should change?</label
        ><textarea id="steer-text" rows="4" maxlength="20000" required></textarea
        ><button class="primary">Save constraint</button>
      </form>
    </dialog>
  </body>
</html>
